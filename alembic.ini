[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url = sqlite:///placeholder.db

[loggers]
keys = root
level = WARN

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
