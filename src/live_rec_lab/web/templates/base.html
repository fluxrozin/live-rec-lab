<!DOCTYPE html>
<html lang="ja" data-font="{{ font }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — LiveRecorder</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">メインコンテンツへ移動</a>
  <div class="shell">
    <aside class="side">
      <div class="brand{% if recording_active %} recording-brand{% endif %}" data-recording="{{ 'yes' if recording_active else 'no' }}">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>LiveRecorder<small class="brand-status">{{ '録画中' if recording_active else '' }}</small></span>
      </div>
      <nav aria-label="メイン">
        {% for group, links in nav %}
        <div class="nav-group">
          <p class="group">{{ group }}</p>
          {% for href, label in links %}
          <a href="{{ href }}" {% if active_path == href %}aria-current="page"{% endif %}>{{ label }}</a>
          {% endfor %}
        </div>
        {% endfor %}
      </nav>
    </aside>
    <main id="main-content" class="main" tabindex="-1">
      <header class="top">
        <p class="asof"><span id="display-freshness">最終取得</span> <time id="display-asof">{{ asof }}</time></p>
        <div class="page-heading">{% block heading %}<h1>{{ title }}</h1>{% endblock %}</div>
      </header>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
