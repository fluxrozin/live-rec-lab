{% extends "base.html" %}
{% block freshness %}<span id="streamer-refresh-error" role="status"></span>{% endblock %}
{% block content %}
<div class="l-page-head"><h1>配信者</h1><button class="c-btn c-btn--primary" data-action="open-add">{{ ui.icon("plus") }}配信者を追加</button></div>
<form id="streamer-search" class="c-toolbar" method="get" action="/streamers" role="search">
  <input class="c-input" type="search" name="q" value="{{ q }}" placeholder="名前・ID で検索" aria-label="検索" style="width:280px">
  <select class="c-select" name="platform" aria-label="サービス"><option value="">すべてのサービス</option><option value="tiktok" {{ 'selected' if platform=='tiktok' }}>TikTok</option><option value="twitcasting" {{ 'selected' if platform=='twitcasting' }}>ツイキャス</option></select>
  <button class="c-btn" type="submit">絞り込み</button>{% include "partials/streamer_count.html" %}
</form>
{% include "partials/streamers.html" %}
<dialog class="c-dialog" id="add-dialog"><form method="dialog" id="add-form" class="u-stack">
  <h2 style="margin:0;font-size:var(--fs-section)">配信者を追加</h2>
  <label>サービス<br><select class="c-select" name="platform" required><option value="tiktok">TikTok</option><option value="twitcasting">ツイキャス</option></select></label>
  <label>IDまたはプロフィールURL<br><input class="c-input" name="account" required style="width:100%" autocomplete="off" placeholder="例: @example / https://twitcasting.tv/example"></label>
  <label>表示名（任意）<br><input class="c-input" name="display_name" style="width:100%" maxlength="100"></label>
  <fieldset class="u-row u-wrap" style="border:0;padding:0;margin:0"><legend class="u-sub">対象（既定は3つともON）</legend>
    <label class="u-row">{{ ui.switch("monitoring_enabled", True, "監視") }}監視</label><label class="u-row">{{ ui.switch("recording_enabled", True, "録画") }}録画</label><label class="u-row">{{ ui.switch("comments_enabled", True, "コメント収集") }}コメント収集</label></fieldset>
  <div class="c-field-error" id="add-error" role="alert"></div>
  <div class="u-row" style="justify-content:flex-end"><button class="c-btn" type="button" data-action="close-add">キャンセル</button><button class="c-btn c-btn--primary" type="submit" value="ok">登録</button></div>
</form></dialog>
<dialog class="c-dialog" id="confirm-dialog"><div class="u-stack"><h2 style="margin:0;font-size:var(--fs-section)" id="confirm-title"></h2><p id="confirm-body" style="margin:0"></p>
  <div class="u-row" style="justify-content:flex-end"><button class="c-btn" data-action="confirm-cancel">キャンセル</button><button class="c-btn c-btn--danger" data-action="confirm-ok">実行</button></div></div></dialog>
{% endblock %}
